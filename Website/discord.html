<!DOCTYPE html>
<html>

<body class="social-page">
<link rel="icon" type="image/png" href="images/icons/website.png">
    <head>
        <link rel="stylesheet" href="style.css">
        <title>DudeTechs</title>
    </head>

    <body>
        <!-- Navigation / Header-->
        <header>
            <nav class=navbar>
                <a href="index.html" class="nav-logo">
                    <h2 class="nav-text">💻 DudeTechs</h2>
                </a>
                <ul class="nav-menu">
                    <a href="about.html" class="nav-link">
                        <img src="images/icons/about.png" alt="" class="nav-icon">
                        About Me
                    </a>
                    <a href="socials.html" class="nav-link">
                        <img src="images/icons/social.png" alt="" class="nav-icon">
                        Social Media
                    </a>
                    <a href="discord.html" class="nav-link">
                        <img src="images/icons/discord.png" alt="" class="nav-icon">
                        Discord
                    </a>
                </ul>
            </nav>
        </header>

        <main>
            <!-- Hero Section -->
            <section class="hero-section">

                <div class="section-content">

                    <div class="profile-header">
                        <img src="images/Profile.jpg" alt="DudeTechs profile picture" class="hero-image">

                        <h2 class="title">DudeTechs</h2>

                        <div class="title-divider"></div>
                    </div>

                    <div class="hero-details">

                        <a href="soon.html" class="social-link" target="_blank" rel="noopener noreferrer">

                            <img src="images/icons/discord.png" alt="" class="nav-icon">
                            DudeTechs's Server

                            <a href="https://discord.gg/dZd6knudFw" class="social-link" target="_blank"
                                rel="noopener noreferrer">

                                <img src="images/icons/discord.png" alt="" class="nav-icon">
                                Bloxy News Vietnam
                            </a>
                            </li>
                    </div>

                </div>

                </div>
            </section>
        </main>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                document.querySelectorAll('a[href]').forEach(link => {
                    link.addEventListener("click", event => {
                        const url = new URL(link.href, window.location.href);

                        // Only animate links to pages on this same website
                        if (
                            url.origin === window.location.origin &&
                            url.pathname.endsWith(".html") &&
                            !event.ctrlKey &&
                            !event.metaKey &&
                            !event.shiftKey &&
                            !event.altKey &&
                            event.button === 0
                        ) {
                            event.preventDefault();

                            document.body.classList.add("page-fade-out");

                            setTimeout(() => {
                                window.location.href = url.href;
                            }, 250);
                        }
                    });
                });
            });
        </script>
    </body>

</html>
